[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "framecoach"
version = "0.2.0"
description = "AI coaching assistant for Street Fighter 6: frame data + guides + a local LLM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=1.9",
    "beautifulsoup4>=4.12",
    "chromadb>=1.0",
    "flask>=3.1",
    "openai>=1.40",
    "requests>=2.31",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
framecoach = "framecoach.cli:main"

[tool.setuptools]
packages = ["framecoach"]

[tool.setuptools.package-data]
framecoach = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
